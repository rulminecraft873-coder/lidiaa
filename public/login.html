<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Shapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<nav>
  <a href="index.html" class="logo">Shapa</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2 class="auth-title">Masuk</h2>
    <p class="auth-sub">Login untuk bisa menulis komentar</p>

    <div class="error-msg" id="authError"></div>

    <form onsubmit="handleLogin(event)">
      <div class="field no-icon">
        <input type="email" id="loginEmail" placeholder="Email" required>
      </div>
      <div class="field no-icon">
        <input type="password" id="loginPassword" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-grad">Masuk</button>
    </form>

    <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
